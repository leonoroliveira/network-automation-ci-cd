---
- name: Generate NTP Configuration
  ansible.builtin.template:
    src: "{{ device_type }}_ntp.j2"
    dest: "/tmp/{{ inventory_hostname }}_ntp.cfg"
    mode: "0644"
  delegate_to: localhost

- name: Deploy NTP Configuration On Arista
  ansible.netcommon.cli_config:
    config: "{{ lookup('file', '/tmp/' ~ inventory_hostname ~ '_ntp.cfg') }}"
  when: device_type == "arista"

- name: Deploy NTP Configuration On SR Linux
  ansible.builtin.command:
    cmd: >
      gnmic set
      -a {{ inventory_hostname }}:57400
      -u {{ ansible_user }}
      -p {{ ansible_password }}
      --skip-verify
      -e json_ietf
      --update-path /
      --update-file /tmp/{{ inventory_hostname }}_ntp.cfg
  when: device_type == "srlinux"

- name: Establish Mikrotik Session
  ansible.netcommon.cli_command:
    command: "/system identity print"
  when: device_type == "mikrotik"

- name: Deploy NTP Configuration On Mikrotik
  ansible.netcommon.cli_command:
    command: "{{ item }}"
  loop: "{{ lookup('file', '/tmp/' ~ inventory_hostname ~ '_ntp.cfg').splitlines() }}"
  when:
    - device_type == "mikrotik"
    - item | trim != ""
