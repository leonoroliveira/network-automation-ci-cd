---
- name: Fix Linux host default routes
  hosts: hosts
  gather_facts: false

  tasks:
    - name: Wait for host IP on eth1
      ansible.builtin.command: >
        docker exec {{ inventory_hostname }}
        sh -c "ip -4 addr show dev eth1 | grep -q 'inet '"
      delegate_to: localhost
      changed_when: false
      retries: 12
      delay: 10
      until: ip_check.rc == 0
      register: ip_check
      when: inventory_hostname is not search('h8$')

    - name: Replace default route via lab gateway
      ansible.builtin.command: >
        docker exec {{ inventory_hostname }}
        sh -c "ip route replace default via {{ gateway_ip }} dev eth1"
      delegate_to: localhost
      changed_when: false
      when: inventory_hostname is not search('h8$')
