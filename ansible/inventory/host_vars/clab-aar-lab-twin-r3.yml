---
ansible_connection: local
device_type: srlinux
site_name: Faro
ospf_area: 3

loopback:
  name: system0
  admin_state: enable
  subinterface:
    index: 0
    admin_state: enable
    ipv4_admin_state: enable
    ip_prefix: 172.16.0.3/32

interfaces:
  - name: ethernet-1/1
    admin_state: enable
    subinterface:
      index: 0
      type: routed
      admin_state: enable
      ipv4_admin_state: enable
      ip_prefix: 172.16.13.3/24

  - name: ethernet-1/2
    admin_state: enable
    subinterface:
      index: 0
      type: routed
      admin_state: enable
      ipv4_admin_state: enable
      ip_prefix: 172.16.23.3/24

  - name: ethernet-1/3
    admin_state: enable
    subinterface:
      index: 0
      type: routed
      admin_state: enable
      ipv4_admin_state: enable
      ip_prefix: 192.168.3.254/24

  - name: ethernet-1/4
    admin_state: enable
    subinterface:
      index: 0
      type: routed
      admin_state: enable
      ipv4_admin_state: enable
      ip_prefix: 192.168.13.254/24

network_instance:
  name: default
  interfaces:
    - system0.0
    - ethernet-1/1.0
    - ethernet-1/2.0
    - ethernet-1/3.0
    - ethernet-1/4.0

ospf:
  name: main
  admin_state: enable
  router_id: 172.16.0.3
  version: ospf-v2
  area_id: 0.0.0.0
  interfaces:
    - interface_name: system0.0
      admin_state: enable
      advertise_subnet: true
      passive: true

    - interface_name: ethernet-1/1.0
      admin_state: enable
      interface_type: point-to-point
      advertise_subnet: true

    - interface_name: ethernet-1/2.0
      admin_state: enable
      interface_type: point-to-point
      advertise_subnet: true

    - interface_name: ethernet-1/3.0
      admin_state: enable
      advertise_subnet: true
      passive: true

    - interface_name: ethernet-1/4.0
      admin_state: enable
      advertise_subnet: true
      passive: true

dhcp:
  - host_name: h3
    mac_address: aa:c1:ab:c2:05:b9
    ip_address: 192.168.3.1/24
    interface: ethernet-1/3

  - host_name: h7
    mac_address: aa:c1:ab:ca:c8:5d
    ip_address: 192.168.13.1/24
    interface: ethernet-1/4

direct_peers:
  - 172.16.13.1
  - 172.16.23.2

remote_peers:
  - 172.16.0.1
  - 172.16.0.2
  - 172.16.0.4

expected_routes:
  - 192.168.1.0
  - 192.168.2.0
  - 192.168.11.0
  - 192.168.12.0
