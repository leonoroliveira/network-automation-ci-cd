hostname r1

ip routing

!
interface Loopback0
   ip address 172.16.0.1/32

!
interface Ethernet1
   description to r2
   no switchport
   no shutdown
   ip address 172.16.12.1/24

!
interface Ethernet2
   description to h1
   no switchport
   no shutdown
   ip address 192.168.1.254/24

!
interface Ethernet3
   description to r3
   no switchport
   no shutdown
   ip address 172.16.13.1/24

!
interface Ethernet4
   description to r4
   no switchport
   no shutdown
   ip address 172.16.14.1/24

!

router ospf 1
   router-id 172.16.0.1
   network 172.16.0.1 0.0.0.0 area 1
   network 192.168.1.0 0.0.0.255 area 1
   network 172.16.12.0 0.0.0.255 area 0
   network 172.16.13.0 0.0.0.255 area 0
   network 172.16.14.0 0.0.0.255 area 0
