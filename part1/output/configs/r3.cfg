{
  "srl_nokia-interfaces:interface": [
    {
      "name": "lo0",
      "admin-state": "enable",
      "subinterface": [
        {
          "index": 0,
          "admin-state": "enable",
          "ipv4": {
            "admin-state": "enable",
            "address": [
              {
                "ip-prefix": "172.16.0.3/32"
              }
            ]
          }
        }
      ]
    },    {
      "name": "ethernet-1/1",
      "admin-state": "enable",
      "subinterface": [
        {
          "index": 0,
          "type": "srl_nokia-interfaces:routed",
          "admin-state": "enable",
          "ipv4": {
            "admin-state": "enable",
            "address": [
              {
                "ip-prefix": "172.16.13.3/24"
              }
            ]
          }
        }
      ]
    },    {
      "name": "ethernet-1/2",
      "admin-state": "enable",
      "subinterface": [
        {
          "index": 0,
          "type": "srl_nokia-interfaces:routed",
          "admin-state": "enable",
          "ipv4": {
            "admin-state": "enable",
            "address": [
              {
                "ip-prefix": "172.16.23.3/24"
              }
            ]
          }
        }
      ]
    },    {
      "name": "ethernet-1/3",
      "admin-state": "enable",
      "subinterface": [
        {
          "index": 0,
          "type": "srl_nokia-interfaces:routed",
          "admin-state": "enable",
          "ipv4": {
            "admin-state": "enable",
            "address": [
              {
                "ip-prefix": "192.168.3.254/24"
              }
            ]
          }
        }
      ]
    }  ],
  "srl_nokia-network-instance:network-instance": [
    {
      "name": "default",
      "interface": [
        {
          "name": "lo0.0"
        },        {
          "name": "ethernet-1/1.0"
        },        {
          "name": "ethernet-1/2.0"
        },        {
          "name": "ethernet-1/3.0"
        }      ],
      "protocols": {
        "srl_nokia-ospf:ospf": {
          "instance": [
            {
              "name": "default",
              "admin-state": "enable",
              "router-id": "172.16.0.3",
              "version": "srl_nokia-ospf-types:ospf-v2",
              "area": [
                {
                  "area-id": "0.0.0.0",
                  "interface": [
                    {
                      "interface-name": "ethernet-1/1.0",
                      "admin-state": "enable",
                      "interface-type": "broadcast",
                      "advertise-subnet": true                    },                    {
                      "interface-name": "ethernet-1/2.0",
                      "admin-state": "enable",
                      "interface-type": "broadcast",
                      "advertise-subnet": true                    },                    {
                      "interface-name": "lo0.0",
                      "admin-state": "enable",
                      "advertise-subnet": true,
                      "passive": true                    }                  ]
                }
              ]
            }
          ]
        }
      }
    }
  ]
}