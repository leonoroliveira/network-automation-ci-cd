/interface bridge
add name=lo

/interface ethernet
set [ find default-name=ether2 ] disabled=no comment="to h4"
set [ find default-name=ether3 ] disabled=no comment="to r2"
set [ find default-name=ether4 ] disabled=no comment="to r1"

/ip address
add address=192.168.4.254/24 interface=ether2
add address=172.16.24.4/24 interface=ether3
add address=172.16.14.4/24 interface=ether4
add address=172.16.0.4/32 interface=lo

/routing ospf instance
set [ find default=yes ] router-id=172.16.0.4

/routing ospf area
add name=area4 area-id=0.0.0.4

/routing ospf network
add network=172.16.0.4/32 area=area4
add network=192.168.4.0/24 area=area4
add network=172.16.14.0/24 area=backbone
add network=172.16.24.0/24 area=backbone
