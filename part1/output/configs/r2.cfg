hostname r2

ip routing

!
interface Loopback0
   ip address 172.16.0.2/32

!
interface Ethernet1
   description to r1
   no switchport
   no shutdown
   ip address 172.16.12.2/24

!
interface Ethernet2
   description to h2
   no switchport
   no shutdown
   ip address 192.168.2.254/24

!
interface Ethernet3
   description to r3
   no switchport
   no shutdown
   ip address 172.16.23.2/24

!
interface Ethernet4
   description to r4
   no switchport
   no shutdown
   ip address 172.16.24.2/24

!

router ospf 1
   router-id 172.16.0.2
   network 172.16.0.2 0.0.0.0 area 2
   network 192.168.2.0 0.0.0.255 area 2
   network 172.16.12.0 0.0.0.255 area 0
   network 172.16.23.0 0.0.0.255 area 0
   network 172.16.24.0 0.0.0.255 area 0
