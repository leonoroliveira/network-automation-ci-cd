targets:
  clab-aar-lab-r1:6030:
    username: admin
    password: admin
    insecure: true
    subscriptions:
      - arista_interfaces
      - arista_ospf_neighbors
      - arista_system

  clab-aar-lab-r2:6030:
    username: admin
    password: admin
    insecure: true
    subscriptions:
      - arista_interfaces
      - arista_ospf_neighbors
      - arista_system

  clab-aar-lab-r3:57400:
    username: admin
    password: admin
    skip-verify: true
    subscriptions:
      - srl_interfaces
      - srl_ospf_neighbors
      - srl_system

subscriptions:

  arista_interfaces:
    paths:
      - /interfaces/interface[name=Ethernet1]/state/counters
      - /interfaces/interface[name=Ethernet2]/state/counters
      - /interfaces/interface[name=Ethernet3]/state/counters
      - /interfaces/interface[name=Ethernet4]/state/counters
      - /interfaces/interface[name=Ethernet5]/state/counters
      - /interfaces/interface[name=Management0]/state/counters
      - /interfaces/interface[name=Ethernet1]/state/oper-status
      - /interfaces/interface[name=Ethernet2]/state/oper-status
      - /interfaces/interface[name=Ethernet3]/state/oper-status
      - /interfaces/interface[name=Ethernet4]/state/oper-status
      - /interfaces/interface[name=Ethernet5]/state/oper-status
      - /interfaces/interface[name=Management0]/state/oper-status
    mode: stream
    stream-mode: sample
    sample-interval: 10s
    encoding: json_ietf


  arista_ospf_neighbors:
    paths:
      - /network-instances/network-instance[name=default]/protocols/protocol[identifier=OSPF][name=1]/ospfv2/areas/area
    mode: stream
    stream-mode: sample
    sample-interval: 10s
    encoding: json_ietf


  arista_system:
    paths:
      - /system/cpus
    mode: stream
    stream-mode: sample
    sample-interval: 30s
    encoding: json_ietf


  srl_interfaces:
    paths:
    - /interface[name=ethernet-1/1]/statistics
    - /interface[name=ethernet-1/2]/statistics
    - /interface[name=ethernet-1/3]/statistics
    - /interface[name=ethernet-1/1]/oper-state
    - /interface[name=ethernet-1/2]/oper-state
    - /interface[name=ethernet-1/3]/oper-state
    mode: stream
    stream-mode: sample
    sample-interval: 10s
    encoding: json_ietf


  srl_ospf_neighbors:
    paths:
      - /network-instance[name=default]/protocols/ospf/instance[name=main]/area/interface/neighbor
    mode: stream
    stream-mode: sample
    sample-interval: 10s
    encoding: json_ietf

  srl_system:
    paths:
      - /system/srl_nokia-system-utilization:utilization
      - /platform/control[slot=A]/cpu
      - /platform/control[slot=A]/memory
    mode: stream
    stream-mode: sample
    sample-interval: 30s
    encoding: json_ietf

outputs:
  prometheus:
    type: prometheus
    listen: ":9804"
    path: /metrics
    strings-as-labels: true
    expiration: 120s
