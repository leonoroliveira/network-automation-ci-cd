name: aar-lab

topology:
  kinds:
    srl:
      image: ghcr.io/nokia/srlinux
    linux:
      image: wbitt/network-multitool:extra
    ceos:
      image: ceos
    mikrotik_ros:
      image: mikrotik_ros

  nodes:
    r1:
      kind: ceos
    r2:
      kind: ceos
    r3:
      kind: srl
      startup-config: |
        system aaa authentication admin-user password admin
    r4:
      kind: mikrotik_ros

    h1:
      kind: linux
      exec:
        - ip addr add 192.168.1.1/24 dev eth1
        - sh -c "ip route del default || true"
        - sh -c "ip route add default via 192.168.1.254 dev eth1 || true"

    h2:
      kind: linux
      exec:
        - ip addr add 192.168.2.1/24 dev eth1
        - sh -c "ip route del default || true"
        - sh -c "ip route add default via 192.168.2.254 dev eth1 || true"

    h3:
      kind: linux
      exec:
        - ip link set dev eth1 address aa:c1:ab:c2:05:b9
        - udhcpc -i eth1 -b
        - sh -c "sleep 5; ip route del default 2>/dev/null || true; ip route add default via 192.168.3.254 dev eth1"

    h4:
      kind: linux
      exec:
        - udhcpc -i eth1 -b

    h5:
      kind: linux
      exec:
        - ip addr add 192.168.11.1/24 dev eth1
        - sh -c "ip route del default || true"
        - sh -c "ip route add default via 192.168.11.254 dev eth1 || true"

    h6:
      kind: linux
      exec:
        - ip addr add 192.168.12.1/24 dev eth1
        - sh -c "ip route del default || true"
        - sh -c "ip route add default via 192.168.12.254 dev eth1 || true"

    h7:
      kind: linux
      exec:
        - ip link set dev eth1 address aa:c1:ab:ca:c8:5d
        - udhcpc -i eth1 -b
        - sh -c "sleep 5; ip route del default 2>/dev/null || true; ip route add default via 192.168.13.254 dev eth1"
    
    h8:
      kind: linux
      exec:
        - udhcpc -i eth1 -b

  links:
    - endpoints: ["r1:eth1", "r2:eth1"]
    - endpoints: ["r1:eth3", "r3:e1-1"]
    - endpoints: ["r1:eth4", "r4:eth3"]
    - endpoints: ["r2:eth3", "r3:e1-2"]
    - endpoints: ["r2:eth4", "r4:eth2"]
    - endpoints: ["h1:eth1", "r1:eth2"]
    - endpoints: ["h2:eth1", "r2:eth2"]
    - endpoints: ["h3:eth1", "r3:e1-3"]
    - endpoints: ["h4:eth1", "r4:eth1"]
    - endpoints: ["h5:eth1", "r1:eth5"]
    - endpoints: ["h6:eth1", "r2:eth5"]
    - endpoints: ["h7:eth1", "r3:e1-4"]
    - endpoints: ["h8:eth1", "r4:eth5"]
